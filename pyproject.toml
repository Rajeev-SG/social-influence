[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "social-influence"
version = "0.1.0"
description = "Brand queue to fail-closed Content Machine production bundle"
requires-python = ">=3.11"
dependencies = ["Pillow>=10"]

[project.scripts]
social-influence = "social_influence.cli:main"

[tool.setuptools.packages.find]
include = ["social_influence*"]
