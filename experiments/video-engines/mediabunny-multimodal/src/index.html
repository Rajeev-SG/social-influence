<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mediabunny multimodal scene renderer</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #07101b;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      canvas {
        display: block;
        width: min(100vw, 56.25vh);
        height: min(177.7778vw, 100vh);
        background: #07101b;
      }
    </style>
  </head>
  <body>
    <canvas id="stage" width="1080" height="1920"></canvas>
    <script src="./scene.js"></script>
  </body>
</html>
