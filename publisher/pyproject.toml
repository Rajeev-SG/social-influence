[project]
name = "social-influence-publisher"
version = "0.1.0"
description = "Self-hosted publisher: turns a PostBundle into real posts on YouTube, TikTok and Instagram"
requires-python = ">=3.10"
dependencies = [
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    "google-auth-oauthlib>=1.1",
    "instagrapi>=2.1",
    "tiktok-uploader>=0.1.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
social-influence = "social_influence.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["social_influence"]